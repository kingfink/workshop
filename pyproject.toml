[project]
name = "workshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "modal==1.6.4",
    "pytest>=8",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
extend-exclude = ["evals/fixtures/*/repo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
