version: 2

models:
  - name: dim_customers
    description: Customers with their order totals, one row each.
    columns:
      - name: customer_id
        description: The customer's ID.
        data_tests: [unique, not_null]
      - name: customer_name
        description: The customer's name.
      - name: created_at
        description: When the customer signed up.
      - name: country
        description: The customer's country, as an ISO 3166-1 alpha-2 code.
      - name: order_count
        description: How many orders the customer has placed.
      - name: lifetime_value
        description: The total of the customer's orders in US dollars.
  - name: fct_orders
    description: Orders, one row each.
    columns:
      - name: order_id
        description: The order's ID.
        data_tests: [unique, not_null]
      - name: customer_id
        description: The customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount
        description: The order total in US dollars.
      - name: ordered_at
        description: When the order was placed.
