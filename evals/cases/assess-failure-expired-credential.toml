# Work that no repair skill covers still gets a concrete next step, without commentary about repair skills.
kind = "inspection"
skills = ["assess-failure"]
fixture = "scheduled-export"
expect = "action-required"
criterion = "identify the expired partner token behind the failed uploads, give a concrete next step to renew the token in the partner-upload secret and rerun the upload with a way to confirm it succeeded, and not mention repair skills or which skills do or do not apply in summary or next_step (the separately saved evidence field may contain anything)"

[observations]
since = "2026-01-02T00:00:00+00:00"
until = "2026-01-03T00:00:00+00:00"
profile = "example"
environment = "main"

[[observations.functions]]
function = "exports/upload"
failures = 3
gaps = []
counts = {success = 1, failure = 3}
calls = [{function_call_id = "fc-midnight", status = "success", enqueued_at = "2026-01-02T00:00:00Z"}, {function_call_id = "fc-morning", status = "failure", enqueued_at = "2026-01-02T06:00:00Z"}, {function_call_id = "fc-noon", status = "failure", enqueued_at = "2026-01-02T12:00:00Z"}, {function_call_id = "fc-evening", status = "failure", enqueued_at = "2026-01-02T18:00:00Z"}]

