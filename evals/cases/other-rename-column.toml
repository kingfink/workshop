# A change no job skill covers, with an obvious check: the agent should make it, show the check, and name the kind.
skills = ["other"]
fixture = "dbt-duckdb"
expect = "pull-request"
kind_line = true
pull_request = "say that a check failed before the change and passes after it"

[remove_columns]
fct_orders = ["amount"]

[add_columns]
fct_orders = { order_total = "DECIMAL(10,2)" }

[issue]
title = "Rename amount to order_total in fct_orders"
body = "Analysts keep confusing `amount` with other amounts. Please rename it to `order_total` in `fct_orders`. Leave the staging model as it is."

[[queries]]
sql = "select order_id, order_total from main.fct_orders order by order_id"
rows = [[101, "49.00"], [102, "49.00"], [103, "199.00"], [104, "49.00"], [105, "49.00"], [106, "49.00"], [107, "199.00"], [108, "49.00"], [109, "199.00"], [110, "49.00"]]
