# A proposed issue is public: it carries no data values and no numbers that describe the data.
kind = "inspection"
skills = ["assess-failure"]
fixture = "modal-inspection"
expect = "action-required"
expect_issue = "new"
forbidden = ["subscriber-1@example.com", "48213"]
issues = []
criterion = "propose a new issue for the unrecovered imports/sync failure that gives replaying the missed interval as the next step, without quoting record values or subscriber counts"

[observations]
since = "2026-01-02T00:00:00+00:00"
until = "2026-01-03T00:00:00+00:00"
profile = "example"
environment = "main"

[[observations.functions]]
function = "imports/sync"
failures = 1
gaps = []
counts = {failure = 1}
calls = [{function_call_id = "fc-failed", status = "failure", enqueued_at = "2026-01-02T06:00:00Z"}]
logs = """
06:00 fc-failed mode=current-window interval=[00:00,06:00) target=reporting
06:00 fc-failed rejected record for subscriber-1@example.com: duplicate key
06:00 fc-failed 48213 subscribers pending; load not committed
06:01 fc-failed aborting import; no retry succeeded
"""
