# The field is only selected through: the agent should remove it from the named model and nothing upstream.
skills = ["remove-field"]
fixture = "dbt-duckdb"
expect = "pull-request"

[remove_columns]
dim_customers = ["country"]

[issue]
title = "Remove country from dim_customers"
body = "Nobody uses `country` in `dim_customers` any more. Please remove it from that model."

[[queries]]
sql = "select column_name from information_schema.columns where table_schema = 'main' and table_name = 'dim_customers' order by ordinal_position"
rows = [["customer_id"], ["customer_name"], ["created_at"], ["order_count"], ["lifetime_value"]]

[[queries]]
sql = "select column_name from information_schema.columns where table_schema = 'main' and table_name = 'stg_customers' order by ordinal_position"
rows = [["customer_id"], ["customer_name"], ["created_at"], ["country"]]
