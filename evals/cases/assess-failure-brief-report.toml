# Detailed failure evidence should not turn the summary and next step into a diagnostic essay.
kind = "inspection"
skills = ["assess-failure"]
fixture = "scheduled-build"
expect = "action-required"
criterion = "keep summary and next_step to at most 40 words each; summarize repeated build failures and skipped publication; make clear that full error details are needed before fixing the cause and verifying successful publication; avoid diagnostic essays or lists of inapplicable repair skills in summary and next_step (the separately saved evidence field may contain supporting detail)"

[observations]
since = "2026-01-02T00:00:00+00:00"
until = "2026-01-03T00:00:00+00:00"
profile = "example"
environment = "main"

[[observations.functions]]
function = "pipeline/sync"
failures = 2
gaps = ["logs truncated to the last 60000 characters"]
counts = {success = 2, failure = 2}
calls = [{function_call_id = "fc-midnight", status = "success", enqueued_at = "2026-01-02T00:00:00Z"}, {function_call_id = "fc-morning", status = "success", enqueued_at = "2026-01-02T06:00:00Z"}, {function_call_id = "fc-noon", status = "failure", enqueued_at = "2026-01-02T12:00:00Z"}, {function_call_id = "fc-evening", status = "failure", enqueued_at = "2026-01-02T18:00:00Z"}]
