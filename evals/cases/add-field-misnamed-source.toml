# The issue names a nonexistent table. Find the loaded source instead of declaring the field unavailable.
skills = ["add-field"]
fixture = "dbt-duckdb"
expect = "pull-request"

[add_columns]
stg_customers = { plan_tier = "VARCHAR" }
